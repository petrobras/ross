[pytest]
# The interface's own configuration. It exists for two reasons.
#
# 1. It is what makes pytest's rootdir land on this folder when someone runs
#    `pytest interface` from the root of the ROSS repository -- and that is what
#    the `conftest.py` here relies on to know that we were the ones called.
#
# 2. ROSS's `pytest.ini` turns on doctest mode for every module. The interface
#    has no doctests, and turning it on here would only make `pytest` import
#    each of our modules looking for nothing.
testpaths = tests

# A deprecation is a scheduled failure, so the suite treats it as one.
#
# WHY THIS EXISTS. `rotor_assembly.py:2418` warned in every report we ever
# produced: "Conversion of an array with ndim > 0 to a scalar is deprecated, and
# will error in future. (Deprecated NumPy 1.25.)". We read it, filed it as
# something to report upstream one day, and moved on -- four slices in a row.
# numpy 2.5 turned it into a TypeError and the clearance analysis stopped
# running, on all three systems at once. Nothing had changed in our code; the
# only thing that changed was that the future arrived.
#
# The warning was never the problem. Reading it and doing nothing was, and
# reading it is a thing a person has to remember to do. So the three categories
# that mean "this will break later" now fail the run on the day they appear,
# instead of the day they expire.
#
# WHY ONLY THESE THREE CATEGORIES. A blanket `error` would also fail on
# UserWarning and LinAlgWarning -- the singular matrix in `run_freq_response`
# and the pseudo-inverse in `harmonic_balance`. Those are ROSS telling us
# something about this rotor, not about a future version; they are noise here,
# they change with the model, and failing on them would teach us to switch this
# off. The rule earns its keep by being narrow.
#
# WHEN THIS GOES RED. The message names the warning, the file and the line. Two
# honest answers exist: fix our side (which is what happened to the numpy one --
# once clearance stopped mixing a scalar with lists, the warning stopped being
# produced at all), or, when the cause lives upstream and we can only wait, add
# one `ignore` line below with the reason and the date. An `ignore` with no
# reason is how this whole mechanism turns back into what it replaced.
filterwarnings =
    error::DeprecationWarning
    error::PendingDeprecationWarning
    error::FutureWarning
