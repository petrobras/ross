repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version — keep in sync with the version CI installs (unpinned in
  # pyproject.toml, so run `pre-commit autoupdate` when CI and hook disagree).
    rev: v0.16.3
    hooks:
      # Run the linter.
      - id: ruff
      # Run the formatter.
      - id: ruff-format