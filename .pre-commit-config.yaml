repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version — keep in sync with the ruff pin in pyproject.toml (dev extras).
    rev: v0.16.3
    hooks:
      # Run the linter.
      - id: ruff
      # Run the formatter.
      - id: ruff-format
  - repo: local
    hooks:
      # Refresh the stored outputs of the documentation notebooks that changed.
      - id: run-notebooks
        name: run changed documentation notebooks
        entry: python3 docs/run_notebooks.py --only-changed
        language: system
        files: ^docs/.*\.ipynb$
        exclude: ^docs/_build/
