# The interface's own CI: check on the three systems, package on Windows, and
# let nothing out that was not run.
#
# WHERE THIS FILE GOES. GitHub only reads workflows from `.github/workflows/`
# at the repository ROOT. It cannot live inside `ross/interface/`, so installing it
# means copying it to `.github/workflows/interface.yml` in the ROSS repository.
# The copy here is the source of truth, and
# `test_the_installed_workflow_is_the_one_we_keep` compares the two the day
# both exist.
#
# WHY `paths`, AND WHY `ross/**` IS AMONG THEM. The interface tests and ships
# the ROSS it lives next to (`pip install "../..[interface]"`), not a pinned copy
# downloaded from GitHub. So a change to `ross/`, to `pyproject.toml` or to
# ROSS's `requirements.txt` has to run this job too: a ROSS change that breaks
# the interface fails on the pull request that made it, not weeks later on
# whoever next touches this folder. Everything else in the repository -- docs,
# tools, the paper -- still leaves this job asleep.
#
# WHY IT CALLS `check.py` INSTEAD OF LISTING THE STEPS. Writing `ruff check`,
# `pytest` and the node batteries here would create a second verification
# recipe, kept by hand, next to the one in `check.py`. Two copies of the same
# intent diverge -- this project has the scars, and the one that rots is
# always the one nobody looks at. There is one recipe, and CI runs it.
#
# WHY IT PACKAGES ONLY ON WINDOWS. The executable exists for the machine that
# has no Python: an engineer's Windows workstation. Linux users have a Python
# and install ROSS as a library, and macOS is not a target (an unsigned,
# un-notarized bundle cannot be opened there without a detour through System
# Settings, and signing it needs an Apple Developer account the project does
# not have). The check job still runs the suite on the three systems, because
# the source has to work everywhere; only the bundle is Windows-only.
#
# WHY IT BUILDS ON EVERY CHANGE, WHEN ONLY A RELEASE SHIPS THE BINARY. The
# bundle users download is produced once, when a release is published. Between
# releases this job is not producing an artifact -- it is **executing the
# README**, every time anything changes. Instructions nobody runs rot in
# silence, and a build recipe is the kind of prose that stops being true
# without anyone noticing.
#
# WHY THE RELEASE UPLOAD IS A SEPARATE STEP. Publishing a GitHub release runs
# this workflow (`release: published`) on the tagged commit; the package job
# zips its bundle and attaches it to that release as
# `ross-interface-<tag>-windows-x64.zip`. That is the only path from a
# `v3.0.0` tag to a downloadable executable: pushing the tag may start these
# jobs (GitHub does not evaluate `paths` for tags) but nothing kept what they
# built. The release step is guarded by the event name, so a manual run or a
# pull request can never write to a release.
#
# WHY THE ARTIFACT UPLOAD STAYS MANUAL. A bundle of a few hundred MB on every
# push would fill the repository's artifact storage to buy nothing: between
# releases the way to get the program is to build it. The upload stays for the
# day somebody wants a binary without a toolchain, and only then --
# `workflow_dispatch`, on request.
#
# WHY IT STILL HAS TO RUN `--selftest`. PyInstaller finishing is not the same
# as the program working: it follows what the code imports and not what the
# code opens. A binary that was produced and never executed is not a
# deliverable, it is a hope.

name: interface

on:
  push:
    paths:
      - "ross/**"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/interface.yml"
  pull_request:
    paths:
      - "ross/**"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/interface.yml"
  workflow_dispatch:
  release:
    types: [published]

defaults:
  run:
    working-directory: ross/interface

jobs:
  check:
    # The ends of the supported range. 3.13 sits between two green runs, and
    # nine jobs to interpolate one point is not worth the minutes.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # The behaviour batteries are the only guards that measure the screen.
      # With `CI` set -- and GitHub sets it -- `test_node_is_available_where_it
      # _is_required` fails instead of skipping, which is the whole reason that
      # test exists.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      # ROSS is the repository above this folder; the extras add ruff, pytest
      # and what only the interface needs.
      - run: pip install "../..[dev,interface]"
      - run: python check.py
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: check-report-${{ matrix.os }}-${{ matrix.python }}
          path: ross/interface/check_report.txt

  package:
    needs: check
    # `contents: write` is what attaching a file to a release needs, and it is
    # granted to this job only: `check` never touches the repository.
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      # The bundle carries the ROSS of this checkout: on a release that is the
      # tagged commit, by construction. `--selftest` prints the version it found.
      - run: pip install "../..[interface]"
      - run: python -m PyInstaller --noconfirm ross-interface.spec
      - name: the executable has to work, not merely exist
        shell: bash
        run: ./dist/ross-interface/ross-interface.exe --selftest
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: ross-interface-windows
          path: ross/interface/dist/ross-interface
          retention-days: 14
      # The zip holds the `ross-interface/` folder, so unpacking gives the user
      # one folder to keep together, with the executable inside it.
      - name: zip the bundle for the release
        if: github.event_name == 'release'
        shell: bash
        run: |
          name="ross-interface-${{ github.event.release.tag_name }}-windows-x64"
          7z a "${name}.zip" ./dist/ross-interface
          ls -l "${name}.zip"
      - name: attach the bundle to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ross/interface/ross-interface-*.zip
