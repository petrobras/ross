[pytest]
# The interface's own configuration. It exists for two reasons.
#
# 1. It is what applies the filterwarnings below when someone runs `pytest` from
#    inside this folder or `cd ross/interface && python check.py`; `pytest ross`
#    from the repository root uses ROSS's own configuration instead.
#
# 2. ROSS's `pytest.ini` turns on doctest mode for every module. The interface
#    has no doctests, and turning it on here would only make `pytest` import
#    each of our modules looking for nothing.
testpaths = tests

# A deprecation is a scheduled failure, so the suite treats it as one.
#
# WHY THIS EXISTS. A deprecation warning that is read and left alone becomes an
# error on the day the dependency drops the old behaviour -- numpy's "Conversion
# of an array with ndim > 0 to a scalar is deprecated" became a TypeError in
# numpy 2.5 and stopped an analysis on every system at once, with nothing
# changed in this code. Reading warnings is a thing a person has to remember to
# do, so the three categories that mean "this will break later" fail the run on
# the day they appear, instead of the day they expire.
#
# WHY ONLY THESE THREE CATEGORIES. A blanket `error` would also fail on
# UserWarning and LinAlgWarning -- the singular matrix in `run_freq_response`
# and the pseudo-inverse in `harmonic_balance`. Those are ROSS telling us
# something about this rotor, not about a future version; they are noise here,
# they change with the model, and failing on them would teach us to switch this
# off. The rule earns its keep by being narrow.
#
# WHEN THIS GOES RED. The message names the warning, the file and the line. Two
# honest answers exist: fix our side (for the numpy one, clearance no longer
# mixes a scalar with lists, so the warning is not produced at all), or, when
# the cause lives upstream and we can only wait, add
# one `ignore` line below with the reason and the date. An `ignore` with no
# reason is how this whole mechanism turns back into what it replaced.
filterwarnings =
    error::DeprecationWarning
    error::PendingDeprecationWarning
    error::FutureWarning
